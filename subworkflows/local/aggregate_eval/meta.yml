name: aggregate_eval
description: Combine per-DB evaluation reports into a single MultiQC report.
keywords:
  - evaluation
  - multiqc
  - aggregate
components:
  - combine/eval
input:
  - per_db_reports:
      type: channel
      description: |
        Channel of (meta, evaluation_dir) tuples emitted by per_db_benchmark.
output:
  - report:
      type: channel
      description: |
        Combined MultiQC report directory.
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "Konstantin Pelz"
maintainers:
  - "Konstantin Pelz"
