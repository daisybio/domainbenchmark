name: per_db_benchmark
description: Run the full benchmark for a single DDI database split.
keywords:
  - ddi
  - benchmark
  - protein
components:
  - ddi/extraction
  - feature/extraction
  - machine/learning
  - random/forest
  - graph/model
  - evaluation
input:
  - db_ch:
      type: channel
      description: |
        Channel of (meta, db_path) tuples. meta = [id, db].
output:
  - report:
      type: channel
      description: |
        Per-DB MultiQC evaluation report directory keyed by meta.
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "Konstantin Pelz"
maintainers:
  - "Konstantin Pelz"
