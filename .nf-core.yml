repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-cobinet-benchmarking-pipeline_logo_light.png
    - docs/images/nf-core-cobinet-benchmarking-pipeline_logo_light.png
    - docs/images/nf-core-cobinet-benchmarking-pipeline_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-cobinet-benchmarking-pipeline_logo_light.png
    - docs/images/nf-core-cobinet-benchmarking-pipeline_logo_light.png
    - docs/images/nf-core-cobinet-benchmarking-pipeline_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: daisybio
  name: cobinet-benchmarking-pipeline
  description: Benchmarking Pipeline for Domain-Domain Interaction Prediction Methods
  author: Konstantin Pelz, Chiara Thomas, Christian Romberg
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - vscode
  is_nfcore: false
