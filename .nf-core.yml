lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-domainbenchmark_logo_light.png
    - docs/images/nf-core-domainbenchmark_logo_light.png
    - docs/images/nf-core-domainbenchmark_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  # No pipeline-level MULTIQC process: bin/eval_multiqc.py and
  # bin/combine_eval.py write their own MultiQC configs, so there is no
  # assets/multiqc_config.yml for this test to inspect.
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    # No pipeline-level MULTIQC process: the report is built by
    # bin/eval_multiqc.py, which writes its own config. Software versions are
    # deliberately not collected either.
    - assets/multiqc_config.yml
    - assets/methods_description_template.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-domainbenchmark_logo_light.png
    - docs/images/nf-core-domainbenchmark_logo_light.png
    - docs/images/nf-core-domainbenchmark_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
nf_core_version: 4.0.2
repository_type: pipeline
template:
  org: daisybio
  name: domainbenchmark
  description: Benchmarking Pipeline for Domain-Domain Interaction Prediction Methods
  author: Konstantin Pelz, Chiara Thomas, Christian Romberg
  force: false
  is_nfcore: false
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - vscode
  version: 1.0.0dev
