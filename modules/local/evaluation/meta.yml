name: evaluation
description: |
  Two-stage evaluation. `EVAL_ONE` scatters: one subtask per prediction
  parquet emits a small JSON of metrics plus downsampled ROC/PR curves.
  `EVALUATION` reduces: collects per-model JSONs for a database and builds
  the per-DB MultiQC report. `COMBINE_EVAL` merges the per-DB reports into
  the cross-database `ddi_report.html`.
keywords:
  - evaluation
  - multiqc
  - metrics
  - roc
  - pr curve
  - benchmark
tools:
  - multiqc:
      description: HTML aggregation of per-model metric JSONs.
      homepage: https://multiqc.info
      documentation: https://multiqc.info/docs/
      licence:
        - "GPL-3.0-or-later"
  - scikit-learn:
      description: Metric computation (AUROC, AUPRC, F1, MCC).
      homepage: https://scikit-learn.org
      documentation: https://scikit-learn.org/stable/
      licence:
        - "BSD-3-Clause"
input:
  - - meta:
        type: map
        description: |
          Groovy Map with database and model information.
    - predictions:
        type: file
        description: Predictions parquet file (one model × DB × feature combo × test variant).
        pattern: "*.parquet"
    - ddi_dir:
        type: directory
        description: DDI_EXTRACTION output of the database; holds every split's `<split>_sources.csv`.
    - model_params:
        type: file
        description: The model's `model_parameters.json` (validation operating points), staged as `model_parameters.json`.
        pattern: "model_parameters.json"
    - reference:
        type: file
        description: |
          W-10: for a 1:k test set (`meta.reference_variant` set), the same model
          task's 1:1 predictions, staged under `reference/`; `[]` otherwise.
        pattern: "*.parquet"
output:
  metrics:
    - - meta:
          type: map
          description: Groovy Map with database and model info.
      - "per_model/${meta.model}.seed${meta.seed}.json":
          type: file
          description: |
            Per-model metric JSON (metrics + downsampled curves); a 1:k test set
            also carries `test_set_shift`.
          pattern: "*.json"
  report:
    - - meta:
          type: map
          description: Groovy Map with database info.
      - "evaluation/":
          type: directory
          description: Per-database MultiQC report directory.
authors:
  - "@konstantinpelz"
maintainers:
  - "@konstantinpelz"
