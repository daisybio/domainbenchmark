name: feature_extraction
description: |
  Compute a single feature encoding for one `(database × split)` cell.
  `FEATURE_EXTRACTION_ONE` is fanned out by the inner `FEATURE_EXTRACTION`
  workflow across all `(feature × split)` combinations. Each task writes one
  `<feature>__<split>.h5`, and the ML modules stage the whole set flat into
  `features/` -- the filename carries the layout, so no intermediate process
  builds a per-feature directory tree.
keywords:
  - feature extraction
  - domain embeddings
  - aacomp
  - aaencode
  - protdcal
  - esm
  - prott5
  - h5
tools:
  - python:
      description: Feature extraction script `extract_features.py` dispatches to encoders under `bin/features/`.
      homepage: https://www.python.org
      documentation: https://docs.python.org
      licence:
        - "PSF-2.0"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing database, feature, and split information,
          e.g. [ id:'random_denoise', feature:'aacomp', dataset:'train' ]
    - database_dir:
        type: directory
        description: |
          Database split directory containing `<dataset>.sqlite3`.
        pattern: "*"
output:
  h5:
    - - meta:
          type: map
          description: Groovy Map with database, feature, and split info.
      - "${meta.feature}__${meta.dataset}.h5":
          type: file
          description: |
            HDF5 feature matrix for one (feature, split). Absent when the
            database has no such split -- the output is optional.
          pattern: "*.h5"
authors:
  - "@konstantinpelz"
maintainers:
  - "@konstantinpelz"
