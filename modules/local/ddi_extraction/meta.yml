name: ddi_extraction
description: |
  Extract domain-domain interaction (DDI) tables from a database split.
  Reads the `<split>.sqlite3` files named by `meta.splits` (`train`,
  `validation`, and one or more `test*`) and writes per-split CSV tables of
  `(domain_1, domain_2, interaction)` rows, plus `<split>_instances.csv` with
  the domain-instance pairs `ddi_split_membership` assigns to that split, for
  downstream feature extraction and model training.
keywords:
  - ddi
  - sqlite
  - domain-domain interaction
  - benchmark
tools:
  - python:
      description: SQL → CSV extraction script.
      homepage: https://www.python.org
      documentation: https://docs.python.org
      licence:
        - "PSF-2.0"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing database information,
          e.g. [ id:'random', splits:['train','validation','test_balanced',
          'test_realistic'], tests:[balanced:'test_balanced',
          realistic:'test_realistic'] ]
    - database_dir:
        type: directory
        description: |
          Directory containing `train.sqlite3`, `validation.sqlite3`, and one
          or more `test*.sqlite3`. A single `.sqlite3` file is also
          accepted; in that case only the `test` split is produced.
        pattern: "*"
output:
  ddi:
    - - meta:
          type: map
          description: Groovy Map containing database information
      - "${meta.id}/DDI":
          type: directory
          description: Per-split DDI CSV directory (train/validation/test* tables).
          pattern: "DDI"
authors:
  - "@konstantinpelz"
maintainers:
  - "@konstantinpelz"
