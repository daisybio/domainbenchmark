name: domainbenchmark-gpu
channels:
  - rapidsai
  - conda-forge
  - nvidia
dependencies:
  - python=3.12.2
  - numpy=2.2.6
  - pandas=2.2.3
  - h5py=3.14.0
  - scikit-learn=1.6.1
  - cuml=26.02.00
  - cuda-version=12.8
  - cudnn=9
  - pip=25.0
  - pip:
      - --index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.org/simple
      - torch==2.7.0
      - skorch==1.1.0
