name: domainbenchmark-gpu
# Without a GPU, create with CONDA_OVERRIDE_CUDA=13.4 so the CUDA pytorch build resolves.
channels:
  - rapidsai
  - conda-forge
dependencies:
  - python=3.14
  - numpy=2.4.6
  - pandas=3.0.6
  - h5py=3.16.0
  - scikit-learn=1.9.1
  - cuml=26.10.00
  - cuda-version=13.4
  - pytorch=2.14.1=cuda*
  - skorch=1.4.0
  - biopython=1.88
  - pyarrow=26.0.0
  - sqlite=3.54.1
