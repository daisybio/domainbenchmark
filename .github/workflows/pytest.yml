name: Run pytest
# Unit tests for the bin/ scripts (tests/python). The results-tree invariants in
# test_invariants.py skip here (DOMAINBENCHMARK_RESULTS is unset): they need a
# finished pipeline --outdir, which the nf-test jobs keep in their own work
# directory. Running them is a manual release gate, see docs/usage.md.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environments/general.yml
          create-args: pytest
          cache-environment: true

      - name: pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: python -m pytest -q -p no:cacheprovider tests/python

  stub-resume:
    # S-12: appending a feature must not re-run unaffected models on -resume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: nf-core/setup-nextflow@b4ec1bc7c16a94435159de94a05253542fddf6ef # v3
        with:
          version: "26.04.0"

      - name: stub resume staging test
        run: tests/stub_resume_staging.sh "$RUNNER_TEMP/stub-resume"
